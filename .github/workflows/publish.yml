name: Release

# Releases when the version in Cargo.toml changes on main: test, publish to
# crates.io, then tag vX.Y.Z and create a GitHub release. Every step is skipped
# if already done, so re-runs are safe.

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Detect version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      on_crates: ${{ steps.crates.outputs.published }}
      tagged: ${{ steps.tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v7

      - name: Read package version
        id: version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d '"' -f 2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Already on crates.io?
        id: crates
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -A "specdev-release (github.com/oiwn/specdev)" \
            "https://crates.io/api/v1/crates/specdev/${{ steps.version.outputs.version }}")
          if [ "$STATUS" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Already tagged?
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test ${{ matrix.os }}
    needs: version
    if: needs.version.outputs.on_crates != 'true' || needs.version.outputs.tagged != 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  publish:
    name: Publish to crates.io
    needs: [version, test]
    if: needs.version.outputs.on_crates != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --locked --dry-run
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  github-release:
    name: GitHub release
    needs: [version, test, publish]
    if: >-
      always()
      && needs.version.outputs.tagged != 'true'
      && needs.test.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
