[package]
name = "specdev"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "Specification-driven development toolkit: a CLI and agent skill for working with project specs."
repository = "https://github.com/oiwn/specdev"
readme = "README.md"
keywords = ["specs", "agent", "cli", "workflow", "checklist"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
