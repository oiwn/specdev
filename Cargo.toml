[package]
name = "specdev"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Specification-driven development toolkit: a CLI and agent skill for working with project specs."
repository = "https://github.com/oiwn/specdev"
readme = "README.md"
keywords = ["specs", "agent", "cli", "workflow", "checklist"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.55", default-features = false }
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
toon-format = { version = "0.5", default-features = false }

[dev-dependencies]
tempfile = "3"
